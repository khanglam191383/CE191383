name: Go CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: taskdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U admin -d taskdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6378:6379

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations
        env:
          PGPASSWORD: admin123
        run: |
          psql -h localhost -p 5433 -U admin -d taskdb -f migrations/000001_create_users_table.up.sql
          psql -h localhost -p 5433 -U admin -d taskdb -f migrations/000002_create_projects_table.up.sql
          psql -h localhost -p 5433 -U admin -d taskdb -f migrations/000003_create_tasks_table.up.sql

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v