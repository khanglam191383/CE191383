version: "3.8"

services:
  db:
    image: postgres:16
    container_name: task_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: taskdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_container
    restart: always
    ports:
      - "6378:6379"    

  api:
    build: .
    container_name: task_api
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"    


volumes:
  pgdata: